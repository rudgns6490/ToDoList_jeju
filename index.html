<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9f9">
  <title>오늘의 할 일</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #4a3e3d;
      background: #fff9f9;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --pink: #b86b7b;
      --pink-dark: #a9586a;
      --pink-light: #f8e9ec;
      --pink-pale: #fff3f4;
      --brown: #4a3e3d;
      --muted: #9b8987;
      --line: #f2e7e6;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      position: relative;
      overflow-x: hidden;
      padding: 72px 20px;
      background:
        radial-gradient(circle at 8% 20%, rgba(248, 222, 226, .56) 0 3px, transparent 4px),
        radial-gradient(circle at 91% 31%, rgba(248, 222, 226, .7) 0 4px, transparent 5px),
        radial-gradient(ellipse at 50% -10%, #fff0f2, transparent 35rem),
        #fff9f9;
    }

    .app {
      width: min(100%, 570px);
      margin: 0 auto;
      position: relative;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 13px;
      padding: 7px 12px;
      border: 1px solid #f2dce0;
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      color: var(--pink);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .eyebrow::before { content: "✿"; font-size: 14px; }

    h1 {
      margin: 0;
      color: var(--brown);
      font-size: clamp(32px, 7vw, 43px);
      font-weight: 780;
      letter-spacing: -.06em;
      line-height: 1.2;
    }

    h1 span { color: var(--pink); }

    .subtitle {
      margin: 12px 0 30px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .title-heart { display: inline-block; margin-left: 4px; color: #e6a6b1; font-size: .58em; vertical-align: top; transform: rotate(12deg); }

    .card {
      overflow: hidden;
      border: 1px solid #f3e5e5;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(137, 86, 96, .09), 0 3px 10px rgba(137, 86, 96, .035);
    }

    form {
      display: flex;
      gap: 11px;
      padding: 20px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    input[type="text"] {
      min-width: 0;
      flex: 1;
      height: 50px;
      padding: 0 16px;
      border: 1px solid #f0e4e3;
      border-radius: 14px;
      outline: none;
      background: #fffafa;
      color: inherit;
      font: inherit;
      font-size: 15px;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }

    input[type="text"]::placeholder { color: #b9a9a7; }
    input[type="text"]:focus {
      border-color: #d89aa5;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(184, 107, 123, .12);
    }

    button { font: inherit; }

    .add-button {
      flex: 0 0 auto;
      min-width: 84px;
      height: 50px;
      padding: 0 17px;
      border: 0;
      border-radius: 14px;
      background: var(--pink);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(184, 107, 123, .2);
      transition: background .18s, transform .18s, box-shadow .18s;
    }

    .add-button:hover { background: var(--pink-dark); box-shadow: 0 7px 15px rgba(184, 107, 123, .25); transform: translateY(-1px); }
    .add-button:active { transform: scale(.97); }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(184, 107, 123, .28);
      outline-offset: 2px;
    }

    .important-toggle {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 42px;
      padding: 0 9px;
      border: 1px solid #f2e4e5;
      border-radius: 12px;
      background: #fffafa;
      color: #9b8987;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: color .18s, background .18s, border-color .18s;
    }

    .important-toggle:has(input:checked) {
      border-color: #efcbd2;
      background: #fff1f3;
      color: var(--pink);
    }

    .important-toggle input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--pink);
      cursor: pointer;
    }

    .important-toggle .star { color: #c9b8b6; font-size: 14px; line-height: 1; transition: color .18s, transform .18s; }
    .important-toggle:has(input:checked) .star { color: #e3a743; transform: scale(1.12); }

    .list { margin: 0; padding: 7px 20px; list-style: none; background: #fff; }

    .task {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      border-bottom: 1px solid var(--line);
      animation: arrive .2s ease-out;
      transition: background .18s;
    }

    .task:last-child { border-bottom: 0; }
    .task:hover { background: linear-gradient(90deg, #fff 0%, #fffafa 50%, #fff 100%); }

    .task-checkbox {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      margin: 0;
      accent-color: var(--pink);
      cursor: pointer;
    }

    .task-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      color: var(--brown);
      font-size: 15px;
      line-height: 1.5;
      transition: color .18s;
    }

    .important-mark {
      flex: 0 0 auto;
      color: #e3a743;
      font-size: 18px;
      line-height: 1;
      filter: drop-shadow(0 1px 1px rgba(185, 125, 34, .12));
    }

    .task.is-complete .task-text {
      color: #b8a9a7;
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    .delete-button {
      flex: 0 0 auto;
      padding: 7px 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #a78f8e;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: color .18s, background .18s;
    }

    .delete-button:hover { background: #fff0f2; color: var(--pink-dark); }

    .empty {
      padding: 38px 16px 42px;
      color: #a78f8e;
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
    }

    .empty-icon {
      display: grid;
      width: 42px;
      height: 42px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 14px;
      border: 1px solid #f4dfe3;
      background: #fff3f5;
      color: var(--pink);
      font-size: 20px;
      box-shadow: 0 5px 14px rgba(184, 107, 123, .09);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px 16px;
      border-top: 1px solid var(--line);
      background: #fffdfd;
      color: var(--muted);
      font-size: 12px;
    }

    .footer strong { color: var(--pink); font-weight: 750; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 48px 16px; }
      form { gap: 8px; padding: 14px; }
      .add-button { min-width: 70px; padding: 0 13px; }
      .list { padding-right: 14px; padding-left: 14px; }
      .footer { padding-right: 16px; padding-left: 16px; }
      .subtitle { margin-bottom: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">MY LITTLE PLAN</p>
    <h1>오늘도 <span>차근차근</span><i class="title-heart" aria-hidden="true">♥</i></h1>
    <p class="subtitle">작은 할 일도 하나씩, 다정하게 완성해 봐요.</p>

    <section class="card" aria-label="할 일 목록">
      <form id="task-form">
        <input id="task-input" type="text" placeholder="새로운 할 일을 입력하세요" autocomplete="off" aria-label="새로운 할 일">
        <label class="important-toggle" for="important-input">
          <input id="important-input" type="checkbox" aria-label="중요한 할 일로 표시">
          <span class="star" aria-hidden="true">★</span><span>중요</span>
        </label>
        <button class="add-button" type="submit">추가</button>
      </form>
      <ul class="list" id="task-list" aria-live="polite"></ul>
      <div class="empty" id="empty-state">
        <div class="empty-icon" aria-hidden="true">✿</div>
        아직 등록된 할 일이 없어요.<br>오늘의 첫 할 일을 적어 볼까요?
      </div>
      <footer class="footer" id="task-footer" hidden>
        <span>남은 할 일 <strong id="remaining-count">0</strong></span>
        <span>전체 <strong id="total-count">0</strong></span>
      </footer>
    </section>
  </main>

  <script>
    const form = document.querySelector('#task-form');
    const input = document.querySelector('#task-input');
    const importantInput = document.querySelector('#important-input');
    const list = document.querySelector('#task-list');
    const emptyState = document.querySelector('#empty-state');
    const footer = document.querySelector('#task-footer');
    const remainingCount = document.querySelector('#remaining-count');
    const totalCount = document.querySelector('#total-count');
    const tasks = [];
    let nextId = 1;

    function render() {
      list.replaceChildren();

      for (const task of tasks) {
        const item = document.createElement('li');
        item.className = `task${task.completed ? ' is-complete' : ''}`;

        const checkbox = document.createElement('input');
        checkbox.className = 'task-checkbox';
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.setAttribute('aria-label', `${task.text} 완료`);
        checkbox.addEventListener('change', () => {
          task.completed = checkbox.checked;
          render();
        });

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;

        if (task.important) {
          const star = document.createElement('span');
          star.className = 'important-mark';
          star.textContent = '★';
          star.setAttribute('role', 'img');
          star.setAttribute('aria-label', '중요');
          item.append(checkbox, text, star);
        } else {
          item.append(checkbox, text);
        }

        const remove = document.createElement('button');
        remove.className = 'delete-button';
        remove.type = 'button';
        remove.textContent = '삭제';
        remove.setAttribute('aria-label', `${task.text} 삭제`);
        remove.addEventListener('click', () => {
          const index = tasks.findIndex((entry) => entry.id === task.id);
          if (index !== -1) tasks.splice(index, 1);
          render();
        });

        item.append(remove);
        list.append(item);
      }

      const remaining = tasks.filter((task) => !task.completed).length;
      emptyState.hidden = tasks.length > 0;
      footer.hidden = tasks.length === 0;
      remainingCount.textContent = remaining;
      totalCount.textContent = tasks.length;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }

      tasks.push({ id: nextId++, text, completed: false, important: importantInput.checked });
      input.value = '';
      importantInput.checked = false;
      render();
      input.focus();
    });
  </script>
</body>
</html>
