<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <title>오늘의 할 일</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20251f;
      background: #f6f7f4;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --green: #3d7154;
      --muted: #81877f;
      --line: #e8ebe5;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 64px 20px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(221, 234, 219, .7), transparent 38rem),
        #f6f7f4;
    }

    .app {
      width: min(100%, 560px);
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 42px);
      font-weight: 760;
      letter-spacing: -.055em;
    }

    .subtitle {
      margin: 10px 0 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(224, 228, 220, .9);
      border-radius: 20px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 18px 50px rgba(40, 53, 39, .08), 0 2px 8px rgba(40, 53, 39, .03);
    }

    form {
      display: flex;
      gap: 10px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    input[type="text"] {
      min-width: 0;
      flex: 1;
      height: 48px;
      padding: 0 15px;
      border: 1px solid #e5e9e2;
      border-radius: 12px;
      outline: none;
      background: #fafbf9;
      color: inherit;
      font: inherit;
      font-size: 15px;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }

    input[type="text"]::placeholder { color: #a4aaa1; }
    input[type="text"]:focus {
      border-color: #82a88e;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(61, 113, 84, .12);
    }

    button { font: inherit; }

    .add-button {
      flex: 0 0 auto;
      min-width: 82px;
      height: 48px;
      padding: 0 17px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s, transform .18s;
    }

    .add-button:hover { background: #315f46; }
    .add-button:active { transform: scale(.97); }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(61, 113, 84, .28);
      outline-offset: 2px;
    }

    .list { margin: 0; padding: 4px 18px; list-style: none; }

    .task {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 62px;
      border-bottom: 1px solid var(--line);
      animation: arrive .2s ease-out;
    }

    .task:last-child { border-bottom: 0; }

    .task-checkbox {
      width: 19px;
      height: 19px;
      flex: 0 0 19px;
      margin: 0;
      accent-color: var(--green);
      cursor: pointer;
    }

    .task-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.5;
      transition: color .18s;
    }

    .task.is-complete .task-text {
      color: #9ba198;
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    .delete-button {
      flex: 0 0 auto;
      padding: 7px 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #969d94;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: color .18s, background .18s;
    }

    .delete-button:hover { background: #fff0ed; color: #bd594a; }

    .empty {
      padding: 38px 16px 42px;
      color: #969d94;
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
    }

    .empty-icon {
      display: grid;
      width: 42px;
      height: 42px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 14px;
      background: #f0f4ee;
      color: var(--green);
      font-size: 20px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .footer strong { color: #596158; font-weight: 700; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 42px 16px; }
      form { gap: 8px; padding: 14px; }
      .add-button { min-width: 70px; padding: 0 13px; }
      .list { padding-right: 14px; padding-left: 14px; }
      .footer { padding-right: 16px; padding-left: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">MY LITTLE PLAN</p>
    <h1>오늘의 할 일</h1>
    <p class="subtitle">하나씩 차근차근, 오늘을 완성해 보세요.</p>

    <section class="card" aria-label="할 일 목록">
      <form id="task-form">
        <input id="task-input" type="text" placeholder="새로운 할 일을 입력하세요" autocomplete="off" aria-label="새로운 할 일">
        <button class="add-button" type="submit">추가</button>
      </form>
      <ul class="list" id="task-list" aria-live="polite"></ul>
      <div class="empty" id="empty-state">
        <div class="empty-icon" aria-hidden="true">✦</div>
        아직 등록된 할 일이 없어요.<br>첫 번째 할 일을 추가해 보세요!
      </div>
      <footer class="footer" id="task-footer" hidden>
        <span>남은 할 일 <strong id="remaining-count">0</strong></span>
        <span>전체 <strong id="total-count">0</strong></span>
      </footer>
    </section>
  </main>

  <script>
    const form = document.querySelector('#task-form');
    const input = document.querySelector('#task-input');
    const list = document.querySelector('#task-list');
    const emptyState = document.querySelector('#empty-state');
    const footer = document.querySelector('#task-footer');
    const remainingCount = document.querySelector('#remaining-count');
    const totalCount = document.querySelector('#total-count');
    const tasks = [];
    let nextId = 1;

    function render() {
      list.replaceChildren();

      for (const task of tasks) {
        const item = document.createElement('li');
        item.className = `task${task.completed ? ' is-complete' : ''}`;

        const checkbox = document.createElement('input');
        checkbox.className = 'task-checkbox';
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.setAttribute('aria-label', `${task.text} 완료`);
        checkbox.addEventListener('change', () => {
          task.completed = checkbox.checked;
          render();
        });

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;

        const remove = document.createElement('button');
        remove.className = 'delete-button';
        remove.type = 'button';
        remove.textContent = '삭제';
        remove.setAttribute('aria-label', `${task.text} 삭제`);
        remove.addEventListener('click', () => {
          const index = tasks.findIndex((entry) => entry.id === task.id);
          if (index !== -1) tasks.splice(index, 1);
          render();
        });

        item.append(checkbox, text, remove);
        list.append(item);
      }

      const remaining = tasks.filter((task) => !task.completed).length;
      emptyState.hidden = tasks.length > 0;
      footer.hidden = tasks.length === 0;
      remainingCount.textContent = remaining;
      totalCount.textContent = tasks.length;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }

      tasks.push({ id: nextId++, text, completed: false });
      input.value = '';
      render();
      input.focus();
    });
  </script>
</body>
</html>
