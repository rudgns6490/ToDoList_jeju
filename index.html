<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9f9">
  <title>오늘의 할 일</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #4a3e3d;
      background: #fff9f9;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --pink: #b86b7b;
      --pink-dark: #a9586a;
      --pink-light: #f8e9ec;
      --pink-pale: #fff3f4;
      --brown: #4a3e3d;
      --muted: #9b8987;
      --line: #f2e7e6;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      position: relative;
      overflow-x: hidden;
      padding: 72px 20px;
      background:
        radial-gradient(circle at 8% 20%, rgba(248, 222, 226, .56) 0 3px, transparent 4px),
        radial-gradient(circle at 91% 31%, rgba(248, 222, 226, .7) 0 4px, transparent 5px),
        radial-gradient(ellipse at 50% -10%, #fff0f2, transparent 35rem),
        #fff9f9;
    }

    .app {
      width: min(100%, 570px);
      margin: 0 auto;
      position: relative;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 13px;
      padding: 7px 12px;
      border: 1px solid #f2dce0;
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      color: var(--pink);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .eyebrow::before { content: "✿"; font-size: 14px; }

    h1 {
      margin: 0;
      color: var(--brown);
      font-size: clamp(32px, 7vw, 43px);
      font-weight: 780;
      letter-spacing: -.06em;
      line-height: 1.2;
    }

    h1 span { color: var(--pink); }

    .subtitle {
      margin: 12px 0 30px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .title-heart { display: inline-block; margin-left: 4px; color: #e6a6b1; font-size: .58em; vertical-align: top; transform: rotate(12deg); }

    .card {
      overflow: hidden;
      border: 1px solid #f3e5e5;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(137, 86, 96, .09), 0 3px 10px rgba(137, 86, 96, .035);
    }

    form {
      display: flex;
      gap: 11px;
      padding: 20px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    input[type="text"] {
      min-width: 0;
      flex: 1;
      height: 50px;
      padding: 0 16px;
      border: 1px solid #f0e4e3;
      border-radius: 14px;
      outline: none;
      background: #fffafa;
      color: inherit;
      font: inherit;
      font-size: 15px;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }

    input[type="text"]::placeholder { color: #b9a9a7; }
    input[type="text"]:focus {
      border-color: #d89aa5;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(184, 107, 123, .12);
    }

    button { font: inherit; }

    .add-button {
      flex: 0 0 auto;
      min-width: 84px;
      height: 50px;
      padding: 0 17px;
      border: 0;
      border-radius: 14px;
      background: var(--pink);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(184, 107, 123, .2);
      transition: background .18s, transform .18s, box-shadow .18s;
    }

    .add-button:hover { background: var(--pink-dark); box-shadow: 0 7px 15px rgba(184, 107, 123, .25); transform: translateY(-1px); }
    .add-button:active { transform: scale(.97); }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(184, 107, 123, .28);
      outline-offset: 2px;
    }

    .important-toggle {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 42px;
      padding: 0 9px;
      border: 1px solid #f2e4e5;
      border-radius: 12px;
      background: #fffafa;
      color: #9b8987;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: color .18s, background .18s, border-color .18s;
    }

    .important-toggle:has(input:checked) {
      border-color: #efcbd2;
      background: #fff1f3;
      color: var(--pink);
    }

    .important-toggle input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--pink);
      cursor: pointer;
    }

    .important-toggle .star { color: #c9b8b6; font-size: 14px; line-height: 1; transition: color .18s, transform .18s; }
    .important-toggle:has(input:checked) .star { color: #e3a743; transform: scale(1.12); }

    .list { margin: 0; padding: 7px 20px; list-style: none; background: #fff; }

    .task {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      border-bottom: 1px solid var(--line);
      animation: arrive .2s ease-out;
      transition: background .18s;
    }

    .task:last-child { border-bottom: 0; }
    .task:hover { background: linear-gradient(90deg, #fff 0%, #fffafa 50%, #fff 100%); }

    .task-checkbox {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      margin: 0;
      accent-color: var(--pink);
      cursor: pointer;
    }

    .task-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      color: var(--brown);
      font-size: 15px;
      line-height: 1.5;
      transition: color .18s;
    }

    .important-mark {
      flex: 0 0 auto;
      color: #e3a743;
      font-size: 18px;
      line-height: 1;
      filter: drop-shadow(0 1px 1px rgba(185, 125, 34, .12));
    }

    .task.is-complete .task-text {
      color: #b8a9a7;
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    .delete-button {
      flex: 0 0 auto;
      padding: 7px 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #a78f8e;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: color .18s, background .18s;
    }

    .delete-button:hover { background: #fff0f2; color: var(--pink-dark); }

    .empty {
      padding: 38px 16px 42px;
      color: #a78f8e;
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
    }

    .empty-icon {
      display: grid;
      width: 42px;
      height: 42px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 14px;
      border: 1px solid #f4dfe3;
      background: #fff3f5;
      color: var(--pink);
      font-size: 20px;
      box-shadow: 0 5px 14px rgba(184, 107, 123, .09);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px 16px;
      border-top: 1px solid var(--line);
      background: #fffdfd;
      color: var(--muted);
      font-size: 12px;
    }

    .footer strong { color: var(--pink); font-weight: 750; }

    .topbar {
      position: absolute;
      top: 22px;
      right: max(20px, calc((100vw - 1120px) / 2));
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .auth-trigger, .logout-button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid #efd9dd;
      border-radius: 999px;
      background: rgba(255,255,255,.9);
      color: var(--pink-dark);
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: background .18s, transform .18s;
    }

    .auth-trigger:hover, .logout-button:hover { background: #fff0f2; transform: translateY(-1px); }
    .user-email { max-width: min(42vw, 240px); overflow: hidden; color: var(--brown); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }

    .auth-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      padding: 20px;
      place-items: center;
      background: rgba(74, 62, 61, .28);
      backdrop-filter: blur(4px);
    }

    .auth-backdrop[hidden] { display: none; }

    .auth-dialog {
      position: relative;
      width: min(100%, 410px);
      padding: 30px;
      border: 1px solid #f1dfe1;
      border-radius: 24px;
      background: #fffdfd;
      box-shadow: 0 24px 70px rgba(77, 45, 51, .2);
    }

    .auth-close {
      position: absolute;
      top: 14px;
      right: 15px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 23px;
      cursor: pointer;
    }

    .auth-close:hover { background: #fff0f2; color: var(--pink-dark); }
    .auth-dialog h2 { margin: 0 0 8px; color: var(--brown); font-size: 25px; letter-spacing: -.04em; }
    .auth-description { margin: 0 0 22px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .auth-form { display: grid; gap: 14px; }
    .auth-field { display: grid; gap: 7px; color: var(--brown); font-size: 13px; font-weight: 700; }
    .auth-field input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid #f0e4e3; border-radius: 12px; background: #fffafa; color: var(--brown); font: inherit; font-size: 14px; }
    .auth-field input:focus { border-color: #d89aa5; outline: 3px solid rgba(184, 107, 123, .12); background: #fff; }
    .auth-submit { min-height: 48px; margin-top: 4px; border: 0; border-radius: 13px; background: var(--pink); color: #fff; font-weight: 750; cursor: pointer; }
    .auth-submit:hover { background: var(--pink-dark); }
    .auth-submit:disabled { opacity: .65; cursor: wait; }
    .auth-switch { margin: 18px 0 0; color: var(--muted); text-align: center; font-size: 13px; }
    .auth-switch button { padding: 0; border: 0; background: transparent; color: var(--pink-dark); font: inherit; font-weight: 750; cursor: pointer; }
    .auth-message { min-height: 20px; margin: 14px 0 0; color: var(--pink-dark); font-size: 13px; line-height: 1.5; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 48px 16px; }
      .topbar { top: 14px; right: 14px; gap: 7px; }
      .auth-trigger, .logout-button { min-height: 38px; padding: 0 12px; font-size: 12px; }
      .user-email { max-width: 38vw; font-size: 12px; }
      .auth-dialog { padding: 26px 22px; }
      form { gap: 8px; padding: 14px; }
      .add-button { min-width: 70px; padding: 0 13px; }
      .list { padding-right: 14px; padding-left: 14px; }
      .footer { padding-right: 16px; padding-left: 16px; }
      .subtitle { margin-bottom: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar" aria-label="계정">
    <button class="auth-trigger" id="auth-open" type="button">로그인</button>
    <span class="user-email" id="user-email" hidden></span>
    <button class="logout-button" id="auth-logout" type="button" hidden>로그아웃</button>
  </header>

  <main class="app">
    <p class="eyebrow">MY LITTLE PLAN</p>
    <h1>오늘도 <span>차근차근</span><i class="title-heart" aria-hidden="true">♥</i></h1>
    <p class="subtitle">작은 할 일도 하나씩, 다정하게 완성해 봐요.</p>

    <section class="card" aria-label="할 일 목록">
      <form id="task-form">
        <input id="task-input" type="text" placeholder="새로운 할 일을 입력하세요" autocomplete="off" aria-label="새로운 할 일">
        <label class="important-toggle" for="important-input">
          <input id="important-input" type="checkbox" aria-label="중요한 할 일로 표시">
          <span class="star" aria-hidden="true">★</span><span>중요</span>
        </label>
        <button class="add-button" type="submit">추가</button>
      </form>
      <ul class="list" id="task-list" aria-live="polite"></ul>
      <div class="empty" id="empty-state">
        <div class="empty-icon" aria-hidden="true">✿</div>
        아직 등록된 할 일이 없어요.<br>오늘의 첫 할 일을 적어 볼까요?
      </div>
      <footer class="footer" id="task-footer" hidden>
        <span>남은 할 일 <strong id="remaining-count">0</strong></span>
        <span>전체 <strong id="total-count">0</strong></span>
      </footer>
    </section>
  </main>

  <div class="auth-backdrop" id="auth-backdrop" hidden>
    <section class="auth-dialog" role="dialog" aria-modal="true" aria-labelledby="auth-title" aria-describedby="auth-description">
      <button class="auth-close" id="auth-close" type="button" aria-label="닫기">×</button>
      <h2 id="auth-title">로그인</h2>
      <p class="auth-description" id="auth-description">이메일과 비밀번호로 내 계정에 로그인해요.</p>
      <form class="auth-form" id="auth-form">
        <label class="auth-field" for="auth-email">이메일
          <input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label class="auth-field" for="auth-password">비밀번호
          <input id="auth-password" type="password" autocomplete="current-password" minlength="6" placeholder="6자 이상 입력해 주세요" required>
        </label>
        <button class="auth-submit" id="auth-submit" type="submit">로그인</button>
      </form>
      <p class="auth-switch"><span id="auth-switch-copy">아직 계정이 없나요?</span> <button id="auth-switch" type="button">회원가입</button></p>
      <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
    </section>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const form = document.querySelector('#task-form');
    const input = document.querySelector('#task-input');
    const importantInput = document.querySelector('#important-input');
    const list = document.querySelector('#task-list');
    const emptyState = document.querySelector('#empty-state');
    const footer = document.querySelector('#task-footer');
    const remainingCount = document.querySelector('#remaining-count');
    const totalCount = document.querySelector('#total-count');
    const authOpen = document.querySelector('#auth-open');
    const authLogout = document.querySelector('#auth-logout');
    const userEmail = document.querySelector('#user-email');
    const authBackdrop = document.querySelector('#auth-backdrop');
    const authForm = document.querySelector('#auth-form');
    const authEmail = document.querySelector('#auth-email');
    const authPassword = document.querySelector('#auth-password');
    const authTitle = document.querySelector('#auth-title');
    const authDescription = document.querySelector('#auth-description');
    const authSubmit = document.querySelector('#auth-submit');
    const authSwitch = document.querySelector('#auth-switch');
    const authSwitchCopy = document.querySelector('#auth-switch-copy');
    const authMessage = document.querySelector('#auth-message');
    let supabase;
    let authMode = 'login';
    let currentUser = null;
    let authConfigError = null;

    function showUser(user) {
      currentUser = user;
      authOpen.hidden = Boolean(user);
      userEmail.hidden = !user;
      authLogout.hidden = !user;
      userEmail.textContent = user?.email ?? '';
      if (user) closeAuthDialog();
    }

    function openAuthDialog() {
      authMessage.textContent = authConfigError || '';
      authBackdrop.hidden = false;
      authEmail.focus();
    }

    function closeAuthDialog() {
      authBackdrop.hidden = true;
      authOpen.focus();
    }

    function setAuthMode(mode) {
      authMode = mode;
      const isSignup = mode === 'signup';
      authTitle.textContent = isSignup ? '회원가입' : '로그인';
      authDescription.textContent = isSignup ? '이메일과 비밀번호로 새 계정을 만들어요.' : '이메일과 비밀번호로 내 계정에 로그인해요.';
      authSubmit.textContent = isSignup ? '회원가입' : '로그인';
      authSwitchCopy.textContent = isSignup ? '이미 계정이 있나요?' : '아직 계정이 없나요?';
      authSwitch.textContent = isSignup ? '로그인' : '회원가입';
      authPassword.autocomplete = isSignup ? 'new-password' : 'current-password';
      authMessage.textContent = '';
    }

    authOpen.addEventListener('click', openAuthDialog);
    document.querySelector('#auth-close').addEventListener('click', closeAuthDialog);
    authBackdrop.addEventListener('click', (event) => {
      if (event.target === authBackdrop) closeAuthDialog();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !authBackdrop.hidden) closeAuthDialog();
    });
    authSwitch.addEventListener('click', () => setAuthMode(authMode === 'login' ? 'signup' : 'login'));

    authForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!supabase) {
        authMessage.textContent = authConfigError || '인증 설정을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
        return;
      }

      authSubmit.disabled = true;
      authMessage.textContent = '';
      const email = authEmail.value.trim();
      const password = authPassword.value;
      try {
        if (authMode === 'signup') {
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) throw error;
          if (data.session) {
            showUser(data.user);
          } else {
            authMessage.textContent = '가입 확인 메일을 보냈어요. 이메일의 링크를 눌러 가입을 완료해 주세요.';
            authPassword.value = '';
          }
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          showUser(data.user);
        }
      } catch (error) {
        authMessage.textContent = error.message || '요청을 처리하지 못했어요. 다시 시도해 주세요.';
      } finally {
        authSubmit.disabled = false;
      }
    });

    authLogout.addEventListener('click', async () => {
      if (!supabase) return;
      authLogout.disabled = true;
      const { error } = await supabase.auth.signOut();
      if (error) authMessage.textContent = error.message;
      else showUser(null);
      authLogout.disabled = false;
    });

    async function initializeAuth() {
      try {
        const response = await fetch('/api/config');
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error('인증 설정 경로를 찾지 못했어요. Vercel에 최신 버전을 배포했는지 확인해 주세요.');
          }
          throw new Error(`인증 설정을 불러오지 못했어요. (HTTP ${response.status})`);
        }
        const { supabaseUrl, supabaseKey, error: configError } = await response.json();
        if (configError) throw new Error(configError);
        if (!supabaseUrl || !supabaseKey) throw new Error('Supabase 환경 변수가 설정되지 않았어요.');
        supabase = createClient(supabaseUrl, supabaseKey);
        const { data: { session } } = await supabase.auth.getSession();
        showUser(session?.user ?? null);
        supabase.auth.onAuthStateChange((_event, nextSession) => showUser(nextSession?.user ?? null));
      } catch (error) {
        authConfigError = error.message;
      }
    }

    initializeAuth();
    const tasks = [];
    let nextId = 1;

    function render() {
      list.replaceChildren();

      for (const task of tasks) {
        const item = document.createElement('li');
        item.className = `task${task.completed ? ' is-complete' : ''}`;

        const checkbox = document.createElement('input');
        checkbox.className = 'task-checkbox';
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.setAttribute('aria-label', `${task.text} 완료`);
        checkbox.addEventListener('change', () => {
          task.completed = checkbox.checked;
          render();
        });

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;

        if (task.important) {
          const star = document.createElement('span');
          star.className = 'important-mark';
          star.textContent = '★';
          star.setAttribute('role', 'img');
          star.setAttribute('aria-label', '중요');
          item.append(checkbox, text, star);
        } else {
          item.append(checkbox, text);
        }

        const remove = document.createElement('button');
        remove.className = 'delete-button';
        remove.type = 'button';
        remove.textContent = '삭제';
        remove.setAttribute('aria-label', `${task.text} 삭제`);
        remove.addEventListener('click', () => {
          const index = tasks.findIndex((entry) => entry.id === task.id);
          if (index !== -1) tasks.splice(index, 1);
          render();
        });

        item.append(remove);
        list.append(item);
      }

      const remaining = tasks.filter((task) => !task.completed).length;
      emptyState.hidden = tasks.length > 0;
      footer.hidden = tasks.length === 0;
      remainingCount.textContent = remaining;
      totalCount.textContent = tasks.length;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }

      tasks.push({ id: nextId++, text, completed: false, important: importantInput.checked });
      input.value = '';
      importantInput.checked = false;
      render();
      input.focus();
    });
  </script>
</body>
</html>
